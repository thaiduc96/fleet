[project]
name = "fleet"
version = "0.1.0"
description = "Dashboard for Claude Code sessions across several Macs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.5",
]

[project.scripts]
fleetd = "fleetd.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fleetd"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# verbatim `pmset -g assertions` output; wrapping it would change what is parsed
"tests/test_system.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
